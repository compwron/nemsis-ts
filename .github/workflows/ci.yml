name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache NEMSIS spec artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .spec
          # Also holds the compiled Schematron, which depends on saxon-js/xslt3 and our patches.
          key: nemsis-spec-${{ hashFiles('spec/**', 'pnpm-lock.yaml', 'src/schematron/patches.ts') }}
      - name: Fetch and verify NEMSIS spec artifacts
        run: pnpm spec:fetch
      - name: Compile NEMSIS Schematron (cached)
        run: pnpm schematron:compile
      - run: pnpm lint
      - name: Generated code is up to date
        run: pnpm codegen:check
      - run: pnpm typecheck
      - run: pnpm test --coverage --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
      - run: pnpm build
      - run: pnpm check:bundle
      - run: pnpm check:package
      - name: Build and check with bundled XSDs (NEMSIS_BUNDLE_XSD)
        if: ${{ matrix.node == 24 }}
        env:
          NEMSIS_BUNDLE_XSD: "1"
        run: pnpm build:with-xsd && pnpm check:bundle
      - if: ${{ !cancelled() && matrix.node == 24 }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            reports/
            coverage/
          retention-days: 14

  browser:
    name: browser smoke (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache NEMSIS spec artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .spec
          key: nemsis-spec-${{ hashFiles('spec/**') }}
      - name: Fetch and verify NEMSIS spec artifacts
        run: pnpm spec:fetch
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
