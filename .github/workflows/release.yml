# Publishes to npm. Deliberately inert until the maintainers turn it on:
#   - it only runs when started by hand (workflow_dispatch), never on push or tag;
#   - the job is skipped unless the repository variable RELEASE_ENABLED is "true";
#   - it refuses while package.json still says "private": true or version 0.0.0;
#   - the `npm` environment can require a reviewer's approval before the job starts.
# See docs/RELEASING.md for the full checklist (including npm trusted publishing setup).
name: release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Do everything except upload to npm"
        type: boolean
        default: true

permissions: {}

jobs:
  publish:
    name: publish to npm
    if: ${{ vars.RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Refuse to publish an unprepared package
        run: |
          node -e '
            const p = JSON.parse(require("fs").readFileSync("package.json", "utf8"));
            if (p.private) { console.error("package.json is still private: true"); process.exit(1); }
            if (p.version === "0.0.0") { console.error("package.json version is still 0.0.0"); process.exit(1); }
            console.log(`releasing ${p.name}@${p.version}`);
          '
      - name: Fetch and verify NEMSIS spec artifacts
        run: pnpm spec:fetch
      - name: Compile NEMSIS Schematron
        run: pnpm schematron:compile
      - run: pnpm lint
      - name: Generated code is up to date
        run: pnpm codegen:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle
      - run: pnpm check:package
      - name: Publish (dry run)
        if: ${{ inputs.dry-run }}
        run: npm publish --provenance --access public --dry-run
      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: npm publish --provenance --access public
