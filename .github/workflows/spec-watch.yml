name: spec-watch

# Weekly check for new NEMSIS 3.5.x release tags in nemsis_public; opens an issue if any.

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check for new NEMSIS releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tag in $(node scripts/spec-watch.ts); do
            title="New NEMSIS release: ${tag}"
            if gh issue list --state all --search "in:title \"${title}\"" --json number --jq 'length' | grep -qx 0; then
              gh issue create --title "${title}" --body "NEMSIS TAC published tag \`${tag}\` in https://git.nemsis.org/scm/nep/nemsis_public.git. Evaluate adding it to \`spec/nemsis.lock.json\` (then run \`node scripts/fetch-spec.ts --write-manifests\`)."
              echo "opened issue for ${tag}"
            else
              echo "issue already exists for ${tag}"
            fi
          done
